name: تطبيق الكاشير (صاحب الكفترية)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cashier:
    name: بناء تطبيق الكاشير (صاحب الكفترية)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment, Version & Signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Auto-increment versionCode on every CI run so updates never conflict
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
            echo "✅ Release signing keystore detected."
          else
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
            if [ ! -f debug.keystore ]; then
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "ℹ️ Release secrets not configured yet; building consistent debug-signed APK."
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Cashier Release APK
        if: env.BUILD_VARIANT == 'release'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Cashier Debug APK (Fallback)
        if: env.BUILD_VARIANT != 'release'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename Cashier APK
        run: |
          mkdir -p output_apks
          if [ "$BUILD_VARIANT" = "release" ]; then
            for f in app/build/outputs/apk/release/*.apk; do
              [ -f "$f" ] && cp "$f" output_apks/Q-Cafe-Cashier.apk
            done
          else
            for f in app/build/outputs/apk/debug/*.apk; do
              [ -f "$f" ] && cp "$f" output_apks/Q-Cafe-Cashier.apk
            done
          fi

      - name: Upload Cashier APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Q-Cafe-Cashier-APK
          path: output_apks/Q-Cafe-Cashier.apk
          retention-days: 30

      - name: Create or Update GitHub Release for Cashier
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0"
          name: "Q-Cafe APKs (تطبيق الكاشير وتطبيق المطور)"
          body: |
            ### ☕ تطبيقات Q-Cafe المحدثة
            - **تطبيق الكاشير (`Q-Cafe-Cashier.apk`):** مخصص لأصحاب الكافتيريات فقط (إدارة الطلبات، المنيو، الطاولات والفواتير).
            - **تطبيق المطور (`Q-Cafe-Developer.apk`):** مخصص للمطور لمتابعة رسوم الـ 1% والتحصيل وحذف الفواتير.
          files: |
            output_apks/Q-Cafe-Cashier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
